name: Release

# Pushing a tag like v1.2.3 builds a signed APK and publishes it in GitHub Releases.
# Creating a release with a new tag in the GitHub web UI does the same (it creates the tag).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # SHA-256 of the signing certificate (public value, see keys/README.md).
      # The build fails if the APK is signed with anything else, so updates can never break by accident.
      EXPECTED_CERT_SHA256: 72b087bff6f52756e330c030d3c5cb90f321b73512ca391dbc37ea45674e31bb
    steps:
      - uses: actions/checkout@v4

      - name: Work out version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ "$((10#$MAJOR))" -gt 99 ] || [ "$((10#$MINOR))" -gt 99 ] || [ "$((10#$PATCH))" -gt 99 ]; then
            echo "::error::Each part of the version must be 0-99 (got $VERSION)"; exit 1
          fi
          # v1.2.3 -> 10203. Grows with every higher version, same tag always gives the same number.
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          if [ "$CODE" -lt 1 ]; then echo "::error::Version must be higher than 0.0.0"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dimwall-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/dimwall-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionName=${{ steps.ver.outputs.version }} \
            -PversionCode=${{ steps.ver.outputs.code }}

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected key ($ACTUAL). Check the KEYSTORE_* secrets."; exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NAME="DimWall-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The release was already created in the web UI: just attach the APK.
            gh release upload "$GITHUB_REF_NAME" "$NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$NAME" --repo "$GITHUB_REPOSITORY" \
              --title "DimWall v${VERSION}" --generate-notes --verify-tag
          fi
